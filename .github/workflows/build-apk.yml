name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set build identity
        run: echo "VITE_BUILD_SHA=${GITHUB_SHA}" > .env.production.local

      - name: Typecheck and web build
        run: pnpm check && pnpm build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: insane-ai-agent-vr-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare latest update manifest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/insane-ai-agent-vr.apk
          cat > release/latest.json <<EOF
          {
            "app": "ai.insane.agentvr",
            "name": "Insane AI Agent",
            "build": "${GITHUB_SHA}",
            "run": "${GITHUB_RUN_NUMBER}",
            "apk": "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/insane-ai-agent-vr.apk",
            "release": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest"
          }
          EOF

      - name: Publish latest GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Insane AI Agent – latest build
          body: Automated APK build from commit ${{ github.sha }}.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release/insane-ai-agent-vr.apk
            release/latest.json
