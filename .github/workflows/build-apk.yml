name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.INSANE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/insane-release.p12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set build identity
        run: echo "VITE_BUILD_SHA=${GITHUB_SHA}" > .env.production.local

      - name: Typecheck and unit tests
        run: pnpm check && pnpm test

      - name: Web build
        run: pnpm build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          INSANE_KEYSTORE_PATH: ${{ runner.temp }}/insane-release.p12
          INSANE_KEYSTORE_PASSWORD: ${{ secrets.INSANE_KEYSTORE_PASSWORD }}
          INSANE_KEY_ALIAS: ${{ secrets.INSANE_KEY_ALIAS }}
          INSANE_KEY_PASSWORD: ${{ secrets.INSANE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace -PversionName=1.0.${{ github.run_number }}

      - name: Verify stable APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=${ANDROID_HOME}/build-tools/36.0.0/apksigner
          CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          EXPECTED=$(tr -d '[:space:]' < android/EXPECTED_SIGNING_CERT_SHA256)
          echo "APK signing cert SHA-256: $CERT"
          test "$CERT" = "$EXPECTED"
          echo "APK_CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orin-release-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare latest update manifest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/orin.apk
          SHA256=$(sha256sum release/orin.apk | cut -d' ' -f1)
          BADGING=$(${ANDROID_HOME}/build-tools/36.0.0/aapt2 dump badging release/orin.apk | head -1)
          VERSION_CODE=$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          VERSION_NAME=$(printf '%s' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "APK SHA-256: $SHA256, versionCode: $VERSION_CODE, versionName: $VERSION_NAME"
          cat > release/latest.json <<EOF
          {
            "app": "ai.insane.agentvr",
            "name": "Orin",
            "build": "${GITHUB_SHA}",
            "run": "${GITHUB_RUN_NUMBER}",
            "versionCode": "${VERSION_CODE}",
            "versionName": "${VERSION_NAME}",
            "sha256": "${SHA256}",
            "signature": "${APK_CERT_SHA256}",
            "apk": "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/orin.apk",
            "release": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest"
          }
          EOF

      - name: Publish latest GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Orin – latest build
          body: Signed APK build from commit ${{ github.sha }}. Signature SHA-256 is pinned in android/EXPECTED_SIGNING_CERT_SHA256.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release/orin.apk
            release/latest.json
